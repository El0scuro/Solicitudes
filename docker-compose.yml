services:

  # =========================
  # FRONTEND - Next.js
  # =========================
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL:  https://mrs-retired-approximately-inside.trycloudflare.com/api
    container_name: ficha-frontend

    ports:
       - "3001:3000"
    volumes:
      - crypto_keys:/app/keys

    depends_on:
      - backend

    environment:
      BACKEND_INTERNAL_URL: http://backend:4000/api
      NEXT_PUBLIC_BACKEND_URL: https://mrs-retired-approximately-inside.trycloudflare.com/api

    networks:
      - ficha-network

  # =========================
  # BACKEND - NestJS
  # =========================
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      network: host

    container_name: ficha-backend

    ports:
      - "4001:4000"

    depends_on:
      - solicitudes-mysql
      - transporte_front-mysql
      - transporte_back-mysql
      - almacenamiento-mysql
      - administrador-mysql
      - secretaria-mysql

    env_file:
      - ./back-end/.env

    volumes:
      - ./back-end:/app
      - /app/node_modules
      - crypto_keys:/app/keys

    networks:
      - ficha-network


  # =========================
  # MYSQL - SOLICITUDES
  # =========================
  solicitudes-mysql:
    image: mysql:8.4
    container_name: solicitudes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: solicitud
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_solicitud.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ficha-network


  # =========================
  # MYSQL - ADMINISTRADOR
  # =========================
  administrador-mysql:
    image: mysql:8.4
    container_name: administrador-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: administrador
    volumes:
      - mysql_administrador:/var/lib/mysql
      - ./init_administrador.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ficha-network


  # =========================
  # MYSQL - SECRETARIA
  # =========================
  secretaria-mysql:
    image: mysql:8.4
    container_name: secretaria-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: secretaria
    volumes:
      - mysql_secretaria:/var/lib/mysql
      - ./init_secretaria.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ficha-network


  # =========================
  # MYSQL - TRANSPORTE FRONT
  # =========================
  transporte_front-mysql:
    image: mysql:8.4
    container_name: transporte-front-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: metadata_llaves_transporte_front
    volumes:
      - mysql_transporte_front_data:/var/lib/mysql
      - ./init_transporte-front.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ficha-network


  # =========================
  # MYSQL - TRANSPORTE BACK
  # =========================
  transporte_back-mysql:
    image: mysql:8.4
    container_name: transporte-back-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: metadata_llaves_transporte_back
    volumes:
      - mysql_transporte_back_data:/var/lib/mysql
      - ./init_transporte-back.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ficha-network


  # =========================
  # MYSQL - ALMACENAMIENTO
  # =========================
  almacenamiento-mysql:
    image: mysql:8.4
    container_name: almacenamiento-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: metadata_llaves_almacenamiento
    volumes:
      - mysql_almacenamiento_data:/var/lib/mysql
      - ./init_almacenamiento.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ficha-network

  # =========================
  # MYSQL - JEFE
  # =========================
  jefe-mysql:
    image: mysql:8.4
    container_name: jefe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jefe
    volumes:
      - mysql_jefe:/var/lib/mysql
      - ./init_jefe.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ficha-network


volumes:
  mysql_jefe:
  mysql_secretaria:
  mysql_administrador:
  mysql_data:
  mysql_transporte_front_data:
  mysql_transporte_back_data:
  mysql_almacenamiento_data:
  crypto_keys:


networks:

  ficha-network:
    driver: bridge
